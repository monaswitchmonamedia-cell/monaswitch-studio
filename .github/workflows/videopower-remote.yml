name: VideoPower Remote Engine

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: videopower-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ingest:
    if: >-
      startsWith(github.event.issue.title, '[VIDEPOWER]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg and Python dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r 00_SYSTEM/SKILLS/videopower/requirements.txt

      - name: Parse request
        id: request
        shell: python
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          import json, os, re
          from pathlib import Path

          event = json.loads(Path(os.environ['EVENT_PATH']).read_text(encoding='utf-8'))
          issue = event['issue']
          body = issue.get('body') or ''
          match = re.search(r'(?im)^URL:\s*(\S+)\s*$', body)
          if not match:
              raise SystemExit('Missing required line: URL: https://...')
          url = match.group(1).strip()
          project_match = re.search(r'(?im)^PROJECT_HINT:\s*(.+?)\s*$', body)
          project = project_match.group(1).strip() if project_match else 'auto'
          number = issue['number']
          outdir = f'VIDEOPOWER_RUNS/issue-{number:05d}'

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              fh.write(f'url={url}\n')
              fh.write(f'project={project}\n')
              fh.write(f'outdir={outdir}\n')
              fh.write(f'issue={number}\n')

      - name: Run deterministic ingest
        id: ingest
        shell: bash
        env:
          URL: ${{ steps.request.outputs.url }}
          OUTDIR: ${{ steps.request.outputs.outdir }}
        run: |
          rm -rf "$OUTDIR"
          python 00_SYSTEM/SKILLS/videopower/scripts/videopower_ingest.py \
            "$URL" \
            --output "$OUTDIR" \
            --frames 16 \
            --scene-threshold 0.30 \
            --max-scenes 24

      - name: Prepare public result bundle
        if: success()
        shell: bash
        env:
          OUTDIR: ${{ steps.request.outputs.outdir }}
          URL: ${{ steps.request.outputs.url }}
          PROJECT: ${{ steps.request.outputs.project }}
          ISSUE: ${{ steps.request.outputs.issue }}
        run: |
          # Do not publish the full source video or extracted audio into the public repository.
          rm -rf "$OUTDIR/source" "$OUTDIR/audio"
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUTDIR'])
          manifest_path = out / 'manifest.json'
          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
              data['source_video'] = '[not committed publicly]'
              data['audio'] = '[not committed publicly]'
              manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          run_md = f'''# VideoPower Remote Run\n\n- Issue: #{os.environ['ISSUE']}\n- Source URL: {os.environ['URL']}\n- Project hint: {os.environ['PROJECT']}\n- Status: INGEST_OK\n\n## Outputs\n\n- `screens/contact-sheet.jpg`\n- `screens/even/`\n- `screens/scenes/`\n- `metadata/metadata.json`\n- `manifest.json`\n\nThe source video and extracted audio are intentionally not committed to this public repository.\n'''
          (out / 'RUN.md').write_text(run_md, encoding='utf-8')
          PY

      - name: Commit screenshots and metadata
        if: success()
        shell: bash
        env:
          OUTDIR: ${{ steps.request.outputs.outdir }}
          ISSUE: ${{ steps.request.outputs.issue }}
        run: |
          git config user.name "MONA VideoPower Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUTDIR"
          git commit -m "videopower: ingest issue #$ISSUE" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Comment success
        if: success()
        uses: actions/github-script@v7
        env:
          OUTDIR: ${{ steps.request.outputs.outdir }}
        with:
          script: |
            const outdir = process.env.OUTDIR;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const raw = `https://raw.githubusercontent.com/${repo}/main/${outdir}`;
            const browse = `https://github.com/${repo}/tree/main/${outdir}`;
            const body = [
              '✅ **VIDEPOWER_INGEST_OK**',
              '',
              `Results: ${browse}`,
              `Contact sheet: ${raw}/screens/contact-sheet.jpg`,
              `Manifest: ${raw}/manifest.json`,
              '',
              'The source video/audio were intentionally not committed publicly.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '❌ **VIDEPOWER_INGEST_FAILED**',
              '',
              'The remote engine could not retrieve or extract this video.',
              'This can happen when the platform requires authentication, changes its anti-bot protections, or the link is not a directly supported public video.',
              '',
              'No access restriction was bypassed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
